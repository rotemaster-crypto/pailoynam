# push ขึ้น main แล้ว deploy ขึ้น Firebase อัตโนมัติ
# ต้องตั้ง secret FIREBASE_SERVICE_ACCOUNT (JSON ของ service account ที่มี role "Firebase Admin")
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy hosting + rules
        run: npx -y firebase-tools@latest deploy --only hosting,firestore --project pailoynam --non-interactive
